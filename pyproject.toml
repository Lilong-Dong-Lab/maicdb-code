[project]
name = "maicdb"
version = "0.2.0"
description = "Mechanically Activated Ion Channel Database (MAIC-DB) — schema and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lilong-Dong-Lab" }]
keywords = ["mechanobiology", "ion-channels", "bioinformatics", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "jinja2>=3.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
maicdb-init-db = "maicdb.database:init_db_cli"
maicdb-dump-schema = "maicdb.database:dump_schema_cli"
maicdb-load = "maicdb.loader:main"
maicdb-query = "maicdb.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maicdb"]

# Lint wiring (M3-T5 retro item 1): uvx ruff check (CI + pre-commit share
# this config). ruff stays out of the dependency set — the same precedent as
# CI's uvx cffconvert.
# E501 explicitly exempted: 97 long lines are pre-existing reality (mostly
# census-SQL quotations in docstrings), not rewritten for the wiring; line
# length stays a review matter.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
