[project]
name = "maicdb"
version = "0.2.0"
description = "Mechanically Activated Ion Channel Database (MAIC-DB) — schema and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lilong-Dong-Lab" }]
keywords = ["mechanobiology", "ion-channels", "bioinformatics", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["sqlalchemy>=2.0", "pyyaml>=6", "jinja2>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
maicdb-init-db = "maicdb.database:init_db_cli"
maicdb-dump-schema = "maicdb.database:dump_schema_cli"
maicdb-load = "maicdb.loader:main"
maicdb-query = "maicdb.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maicdb"]

# Lint 接线（M3-T5 retro 落地 1）：uvx ruff check（CI + pre-commit 共用此
# 配置）。ruff 不进依赖集 —— 与 CI 的 uvx cffconvert 同一先例。
# E501 显式豁免：97 处长行是既有现状（docstring 的 census SQL 引文为主），
# 不为接线改写；行长仍属 review 范畴。
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
