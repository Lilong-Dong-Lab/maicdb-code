name: ci

on:
  pull_request:
  push:
    branches: [main]
  # T9's manual deploy path (issue #45): after setting DEPLOY_SITE, the
  # maintainer can fire a deploy without waiting for a push to main.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags: the Zenodo staging tests verify the bundle
          # against the v1.0.0-data tag blobs (tests/test_zenodo_bundle.py)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint (ruff, config in pyproject; not a dependency — uvx, the cffconvert precedent)
        # M3-T5 retro item 1: the repo shipped a `# noqa: E402` to a linter
        # that didn't exist; this wires the check the noqa was preempting.
        # E501 is config-exempt (existing long census-SQL docstrings).
        # Version-pinned to match .githooks/run-suite.sh's hook.
        run: uvx ruff@0.17.3 check .
      - name: Declared suite pins are exactly two and mirrored (static)
        run: bash scripts/check-suite-matrix.sh --pins
      - name: Site build, both locales (byte-stable)
        # M3-T7 (issue #42): CI builds the site exactly as a human/deploy
        # does — default --out into gitignored site/_data + site/_site —
        # then byte-compares an independent second build: spec §6's
        # determinism contract verified in the CI environment itself. The
        # suite step below re-verifies it via
        # tests/test_site_build.py::test_build_is_byte_stable on tmp dirs;
        # this step additionally exercises the default-argument path the
        # deploy job deploys. db/maicdb.sqlite ships in-repo, so the
        # build (and its byte-stability) never skips in CI (quirk 3).
        run: |
          PYTHONPATH=src uv run python site/build.py
          PYTHONPATH=src uv run python site/build.py --out /tmp/site-rebuild
          diff -r site/_data /tmp/site-rebuild/_data
          diff -r site/_site /tmp/site-rebuild/_site
          test -f site/_site/index.html && test -f site/_site/zh/index.html
      - name: Test suite (summary pinned — KNOWN-QUIRKS quirk 3)
        # CI runs without the vault checkout: the 7 vault-dependent loader
        # tests auto-skip and db/maicdb.sqlite ships in-repo, so the query
        # suite runs in full (the 18 tag-gated Zenodo tests run: fetch-depth
        # above brings the tag). A count drift fails the pin on purpose;
        # scripts/check-suite-matrix.sh re-derives both signatures by
        # execution — run it instead of doing pin arithmetic by hand.
        # Local with-vault reference: pending — data/ restored on main (vault PR #114, 2026-11-05) but 6 loader tests still fail on tools/ paths deleted by the same incident (a2c0231); last healthy 160 passed (2026-11-04, pre-PR #64).
        run: |
          set -o pipefail
          PYTHONPATH=src uv run pytest tests/ -q 2>&1 | tee pytest-summary.txt
          # digit-boundary anchors on both ends: "160 passed" or "1 warning"
          # inside "11 warnings" must NOT match the pin (vacuous-pass guard)
          grep -qE "(^|[^0-9])154 passed, 8 skipped, 1 warning([^0-9]|$)" pytest-summary.txt || {
            if grep -qE "(^|[^0-9])136 passed, 26 skipped, 1 warning([^0-9]|$)" pytest-summary.txt; then
              echo "::error::'136 passed, 26 skipped' = the tag-absent signature — the v1.0.0-data tag is missing from the checkout. Fix the fetch (fetch-depth: 0 + tags), do NOT re-pin."
            else
              echo "::error::suite summary drifted from the pinned '154 passed, 8 skipped, 1 warning' — if a test was genuinely added/removed, run scripts/check-suite-matrix.sh and re-pin here and in KNOWN-QUIRKS quirk 3"
            fi
            exit 1
          }
      - name: Stat lines in PR body / commit messages match a fresh re-run
        # CODING_STANDARDS rule 2, fourth strike (PR #26 body, 2026-10-26):
        # a hand-written stat line ("4 files +41/−8") contradicted the real
        # `git diff --shortstat`. Stat-shaped lines are a fixed syntactic
        # pattern, so they are machine-checked here: every stat line pasted
        # in the PR body or a commit message must equal a fresh re-derivation
        # — the whole-diff stat or any single commit's stat in the range.
        # Paste stat lines unwrapped; and only the PR's own stats verify —
        # a historical or sub-range stat line matches no re-derivation and
        # fails the step, so don't paste those.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          RANGE="origin/${{ github.base_ref }}...HEAD"
          PAT='[0-9]+ files? changed(, [0-9]+ insertions?\(\+\))?(, [0-9]+ deletions?\(-\))?|[0-9]+ files \+[0-9]+/[−-][0-9]+'
          norm() { sed 's|−|-|g'; }
          if ! BODY="$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"; then
            echo "::error::gh pr view failed — the stat-lines check cannot read the PR body"
            exit 1
          fi
          # `|| true` covers grep's no-match exit under pipefail (gate
          # MAJOR-1: set -e killed the script at this assignment before the
          # empty-case handler ran); the gh failure path fails loudly above.
          PASTED="$(printf '%s\n%s\n' "$BODY" "$(git log --format=%B "$RANGE")" | grep -oE "$PAT" | norm | sort -u || true)"
          if [ -z "$PASTED" ]; then echo "no stat-shaped lines to verify"; exit 0; fi
          numstat_compact() { awk '$1=="-" {f++; next} {f++; a+=$1; d+=$2} END {if (f) printf "%d files +%d/-%d\n", f, a, d}'; }
          ACCEPTED="$( { git diff "$RANGE" --shortstat; git diff "$RANGE" --numstat | numstat_compact; while read -r sha; do git show --shortstat --format= "$sha"; git show --numstat --format= "$sha" | numstat_compact; done < <(git log --format=%H "$RANGE"); } | grep -oE "$PAT" | norm | sort -u || true )"
          STATUS=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if grep -qxF "$line" <<<"$ACCEPTED"; then
              echo "ok: $line"
            else
              echo "::error::stat line '$line' matches no fresh re-run (whole diff or any single commit in $RANGE) — CODING_STANDARDS rule 2"
              STATUS=1
            fi
          done <<<"$PASTED"
          exit $STATUS
      - name: No test silently deleted (retro on PR #48)
        # A test function deleted without an addition and without a
        # 'test-removal:' commit declaration fails the PR. Born 2026-11-02:
        # an Edit anchored on a neighbouring test's decorator+def lines
        # swallowed the whole-suite DB-hash guard on PR #48 while the
        # suite stayed green — the pins bless totals, this names the lost.
        # Known limitations are documented in the script header (the
        # detector keys on def lines; a gutted body with the def line
        # kept is covered by the pins + review, not here).
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/check-no-deleted-tests.sh --selftest
          bash scripts/check-no-deleted-tests.sh "origin/${{ github.base_ref }}...HEAD"
      - name: CITATION.cff schema validation
        # The CFF is a live citation surface (GitHub renders it; the DOI
        # is pinned) — validated ad hoc until PR #24's gate ran
        # `uvx cffconvert` by hand. Tool-only dep (uvx; no pyproject change).
        run: uvx cffconvert --validate

  deploy-pages:
    needs: tests
    # ADR-0004 ("Site publishing inherits the flip gate … pre-submission
    # publicity", which itself cites ADR-0002) + flip runbook §3: the
    # public flip (T8, issue #44) is the
    # human gate — this job must be structurally unable to run before it.
    # The DEPLOY_SITE repo variable stays unset until T9 (issue #45) sets
    # it post-flip (`gh variable set DEPLOY_SITE --body true`), so every
    # pre-flip run — PR and push alike — shows this job SKIPPED (issue
    # #42's acceptance: verifiably skipped while the repo is private).
    # Enabling also needs Settings → Pages → Source: GitHub Actions (T9,
    # post-flip; a private repo cannot serve Pages anyway). Scope: push
    # to main or manual dispatch, never a PR; needs the green suite. The
    # build is byte-stable (spec §6), so the deployed bytes equal the
    # bytes the tests job just verified on the same commit.
    if: >-
      vars.DEPLOY_SITE == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Site build (both locales)
        run: PYTHONPATH=src uv run python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
