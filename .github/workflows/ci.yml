name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags: the Zenodo staging tests verify the bundle
          # against the v1.0.0-data tag blobs (tests/test_zenodo_bundle.py)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Test suite (summary pinned — KNOWN-QUIRKS quirk 3)
        # CI runs without the vault checkout: the 7 vault-dependent loader
        # tests auto-skip and db/maicdb.sqlite ships in-repo, so the query
        # suite runs in full (the 17 tag-gated Zenodo tests run: fetch-depth
        # above brings the tag). A count drift fails the pin on purpose;
        # scripts/check-suite-matrix.sh re-derives both signatures by
        # execution — run it instead of doing pin arithmetic by hand.
        # Local with-vault reference: 85 passed (at PR #23, 2026-10-25).
        run: |
          set -o pipefail
          PYTHONPATH=src uv run pytest tests/ -q 2>&1 | tee pytest-summary.txt
          # digit-boundary anchors on both ends: "160 passed" or "1 warning"
          # inside "11 warnings" must NOT match the pin (vacuous-pass guard)
          grep -qE "(^|[^0-9])78 passed, 7 skipped, 1 warning([^0-9]|$)" pytest-summary.txt || {
            if grep -qE "(^|[^0-9])61 passed, 24 skipped, 1 warning([^0-9]|$)" pytest-summary.txt; then
              echo "::error::'61 passed, 24 skipped' = the tag-absent signature — the v1.0.0-data tag is missing from the checkout. Fix the fetch (fetch-depth: 0 + tags), do NOT re-pin."
            else
              echo "::error::suite summary drifted from the pinned '78 passed, 7 skipped, 1 warning' — if a test was genuinely added/removed, run scripts/check-suite-matrix.sh and re-pin here and in KNOWN-QUIRKS quirk 3"
            fi
            exit 1
          }
